name: Build
on: [push, pull_request]
jobs:
  linux:
    name: Linux PHP ${{ matrix.image }}
    runs-on: ubuntu-24.04
    container: php:${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - 8.3-cli-bookworm
          - 8.4-cli-bookworm
          - 8.4-zts-bookworm
          - 8.5-cli-bookworm
          - 8.5-zts-bookworm
          - 8.6-rc-cli-bookworm
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends $PHPIZE_DEPS \
            libc-client-dev libkrb5-dev libssl-dev dovecot-imapd
      - name: git checkout
        uses: actions/checkout@v4
      - name: Start Dovecot
        run: |
          groupadd -g 5000 vmail
          useradd -m -d /var/vmail -s /bin/false -u 5000 -g vmail vmail
          cp tests/setup/dovecot.conf tests/setup/dovecotpass /etc/dovecot/
          dovecot
      - name: phpize
        run: phpize
      - name: configure
        run: ./configure
      - name: make
        run: make
      - name: Check that SSL and Kerberos support are enabled
        run: |
          php -n -d extension=modules/imap.so --ri imap | grep 'SSL Support => enabled'
          php -n -d extension=modules/imap.so --ri imap | grep 'Kerberos Support => enabled'
      - name: Check that the test account can log in
        run: |
          for _ in $(seq 50); do
            php -r 'exit(@fsockopen("127.0.0.1", 143) ? 0 : 1);' && break
            sleep 0.2
          done
          php -n -d extension=modules/imap.so -r '
            require "tests/setup/imap_include.inc";
            exit(imap_open(IMAP_SERVER_NO_DEBUG, IMAP_MAILBOX_USERNAME, IMAP_MAILBOX_PASSWORD, OP_HALFOPEN, 0) ? 0 : 1);'
      - name: make test
        run: make test TESTS="-j1 --show-diff tests"
        env:
          NO_INTERACTION: 1
          REPORT_EXIT_STATUS: 1
      - name: Set up a GSSAPI login for bug63126.phpt
        run: |
          apt-get install -y --no-install-recommends dovecot-gssapi krb5-user
          cat > /etc/krb5.conf <<'EOF'
          [libdefaults]
            default_realm = EXAMPLE.COM
          EOF
          printf 'addent -password -p imap/localhost@EXAMPLE.COM -k 1 -e aes256-cts-hmac-sha1-96\nsecret\nwkt /etc/dovecot/krb5.keytab\nquit\n' | ktutil
          chmod 644 /etc/dovecot/krb5.keytab
          sed -i -e 's/^auth_mechanisms = .*/auth_mechanisms = gssapi plain/' \
            -e 's/^disable_plaintext_auth = .*/disable_plaintext_auth = no/' /etc/dovecot/dovecot.conf
          cat >> /etc/dovecot/dovecot.conf <<'EOF'
          auth_krb5_keytab = /etc/dovecot/krb5.keytab
          auth_gssapi_hostname = "$ALL"
          EOF
          dovecot reload
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Run bug63126.phpt
        run: |
          make test TESTS="--show-diff tests/bug63126.phpt" | tee gssapi.log
          grep -E 'Tests passed +: +1 ' gssapi.log
        env:
          NO_INTERACTION: 1
          REPORT_EXIT_STATUS: 1
  alpine:
    name: Alpine PHP 8.5 (build only)
    runs-on: ubuntu-24.04
    container: php:8.5-cli-alpine
    steps:
      - name: Install dependencies
        run: apk add --no-cache $PHPIZE_DEPS imap-dev openssl-dev
      - name: git checkout
        uses: actions/checkout@v4
      - name: phpize
        run: phpize
      - name: configure
        run: ./configure
      - name: make
        run: make
      - name: Check that SSL support is enabled
        run: php -n -d extension=modules/imap.so --ri imap | grep 'SSL Support => enabled'
  no-c-client:
    name: Debian 13 without c-client (configure error)
    runs-on: ubuntu-24.04
    container: php:8.5-cli
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends $PHPIZE_DEPS
      - name: git checkout
        uses: actions/checkout@v4
      - name: phpize
        run: phpize
      - name: configure fails with a clear message
        run: |
          if ./configure > configure.log 2>&1; then
            echo "configure succeeded without c-client"
            exit 1
          fi
          grep 'Cannot find rfc822.h' configure.log
  pie:
    name: Install with PIE (PHP 8.5)
    runs-on: ubuntu-24.04
    container: php:8.5-cli-bookworm
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends $PHPIZE_DEPS \
            libc-client-dev libkrb5-dev libssl-dev
      - name: git checkout
        uses: actions/checkout@v4
      - name: Install PIE
        run: |
          curl -fsSL -o /usr/local/bin/pie https://github.com/php/pie/releases/latest/download/pie.phar
          chmod +x /usr/local/bin/pie
      - name: pie install
        run: |
          pie repository:add path "$GITHUB_WORKSPACE"
          pie install 'sirlouen/imap:*@dev'
      - name: Check that the extension is loaded with SSL support
        run: php --ri imap | grep 'SSL Support => enabled'
  windows:
    defaults:
      run:
        shell: cmd
    strategy:
      matrix:
        version: ['8.4']
        arch: [x64]
        ts: [ts]
    runs-on: windows-2022
    steps:
      - name: Checkout imap
        uses: actions/checkout@v4
      - name: Setup PHP
        id: setup-php
        uses: php/setup-php-sdk@v0.12
        with:
          version: ${{matrix.version}}
          arch: ${{matrix.arch}}
          ts: ${{matrix.ts}}
      - name: Fetch dependencies
        run: |
          curl -LO https://downloads.php.net/~windows/pecl/deps/c-client-2007f-1-vs16-${{matrix.arch}}.zip
          7z x c-client-2007f-1-vs16-${{matrix.arch}}.zip -o..\deps
      - name: Enable Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.arch}}
          toolset: ${{steps.setup-php.outputs.toolset}}
      - name: phpize
        run: phpize
      - name: configure
        run: configure --with-imap --with-prefix=${{steps.setup-php.outputs.prefix}}
      - name: make
        run: nmake
